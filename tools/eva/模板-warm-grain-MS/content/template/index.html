<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warm Grain - Hyperframes</title>
    <!-- t12 适配：上游 CDN gsap 改为随包 vendored 副本 3.14.2（禁运行时 CDN） -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f5f0e0; /* Cream background */
        font-family: "Outfit", sans-serif;
      }

      #main-composition {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Paper texture and Grain overlay */
      #grain-overlay-comp {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
      }

      /* Grain animation */
      @keyframes grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }

      .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        /* t12 适配：上游 transparenttextures.com 外链纹理授权未核（红线：授权不明不打包）
           → 自渲确定性颗粒纹理（PIL 种子噪声 256×256 RGBA 可平铺，随包 assets/grain-texture.png） */
        background: url("assets/grain-texture.png");
        opacity: 0.15;
        /* t12 适配：上游 infinite CSS 动画不吃 timeline seek（HyperFrames 帧泵契约），
           由 renderAt 每帧驱动同一 10 档位移表（0.5s 周期，见文件尾垫片 __hfApplyGrain），逐帧一致 */
      }

      #a-roll {
        position: absolute;
        border-radius: 16px;
        /* t12 适配：object-fit: cover 迁至内层 #a-roll-video；窗口容器加溢出裁剪配合圆角 */
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .comp-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      /* t12 适配：字体本地化 —— Outfit/Inter variable woff2 随包（OFL 许可随包 assets/fonts/*.txt） */
      @font-face {
        font-family: "Outfit";
        src: url("assets/fonts/Outfit-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }

      /* t12 适配：人物窗两层结构 —— 外层 #a-roll 几何由相机编排(GSAP)驱动；内层取景层由 face 轨迹(renderAt)驱动 */
      #a-roll-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #a-roll-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- t12 适配：上游 __VIDEO_DURATION__ 占位符 → 包默认 10（registry-item duration；运行时可用 loadPack 改写） -->
    <div
      id="main-composition"
      data-composition-id="main-video"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
    >
      <!-- Background Layer -->
      <div
        id="grain-overlay-comp"
        data-composition-id="grain-overlay"
        data-width="1920"
        data-height="1080"
        data-start="0"
        data-duration="10"
        data-track-index="100"
      >
        <div class="grain-texture"></div>
        <script>
          const grainTl = gsap.timeline({ paused: true });
          window.__timelines = window.__timelines || {};
          window.__timelines["grain-overlay"] = grainTl;
        </script>
      </div>

      <!-- A-Roll Video (muted — audio is separate) -->
      <!-- t12 适配：#a-roll 由 video 标签改为窗口容器（圆角/阴影/溢出裁剪不变），内包取景层。
           外层几何仍由下方相机编排(GSAP)驱动，为纯视觉容器（不带计时属性，计时归属内层媒体元素，
           避免 HyperFrames 嵌套计时媒体契约错误）；内层取景由 face 轨迹(renderAt 每帧)驱动，两层分离互不覆写 transform。
           计时/轨位属性(data-start/duration/track-index)迁至内层 media 元素（即上游原 #a-roll 媒体语义等价迁移）。 -->
      <div id="a-roll">
        <div id="a-roll-frame">
          <video
            id="a-roll-video"
            src="assets/demo/a-roll-demo.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="10"
            data-track-index="0"
          ></video>
        </div>
      </div>
      <audio
        id="a-roll-audio"
        src="assets/demo/a-roll-demo.mp4"
        data-start="0"
        data-duration="10"
        data-track-index="5"
        data-volume="1"
      ></audio>

      <!-- Compositions -->
      <div
        id="intro-layer"
        class="comp-layer"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="graphics-layer"
        class="comp-layer"
        data-composition-id="graphics"
        data-composition-src="compositions/graphics.html"
        data-start="0"
        data-duration="10"
        data-track-index="2"
      ></div>

      <div
        id="captions-layer"
        class="comp-layer"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="10"
        data-track-index="3"
      ></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // A-Roll Framing Strategy
        // 1. 0s-1.8s: Intro scale up from small (60%) to medium (80%) - Shifted right slightly to clear speaker card
        // 2. 1.8s-4.6s: Grid view / Shift Left (x: 600, scale: 70%) for 47% graphic
        // 3. 4.6s-8.8s: Shift Center-Bottom (y: 800, scale: 70%) for 62% graphic (top)
        // 4. 8.8s-14s: Shift Right (x: 1320, scale: 75%) for Editing Skills graphic (left)
        // 5. 14s-17s: Final Reveal (Center, scale: 100%)

        // Initial state
        gsap.set("#a-roll", {
          x: 1100,
          y: 540,
          xPercent: -50,
          yPercent: -50,
          width: 1920 * 0.6,
          height: 1080 * 0.6,
        });

        // 1. Intro Scale Up (0s - 1.8s)
        tl.to(
          "#a-roll",
          {
            x: 1200,
            width: 1920 * 0.8,
            height: 1080 * 0.8,
            duration: 1.8,
            ease: "power2.inOut",
          },
          0,
        );

        // 2. Moment 1: 47% Graphic Trigger (1.8s) - Shift Left
        tl.to(
          "#a-roll",
          {
            x: 600,
            y: 540,
            width: 1920 * 0.7,
            height: 1080 * 0.7,
            duration: 0.5,
            ease: "power2.inOut",
          },
          1.8,
        );

        // 3. Moment 2: 62% Graphic Trigger (4.6s) - Shift Center-Bottom
        tl.to(
          "#a-roll",
          {
            x: 960,
            y: 750,
            width: 1920 * 0.7,
            height: 1080 * 0.7,
            duration: 0.5,
            ease: "power2.inOut",
          },
          4.6,
        );

        // 4. Moment 3: Editing Skills Trigger (8.8s) - Shift Right
        tl.to(
          "#a-roll",
          {
            x: 1320,
            y: 540,
            width: 1920 * 0.75,
            height: 1080 * 0.75,
            duration: 0.5,
            ease: "power2.inOut",
          },
          8.8,
        );

        // 5. Final Reveal (14s - 17s)
        tl.to(
          "#a-roll",
          {
            x: 960,
            y: 540,
            width: 1920 * 1.0,
            height: 1080 * 1.0,
            duration: 1.0,
            ease: "power2.inOut",
          },
          14,
        );

        window.__timelines["main-video"] = tl;
      </script>

      <!-- t12 云适配垫片（组合挂载/颗粒驱动/人物窗取景/renderAt/loadPack），独立文件 assets/hf-adapter.js -->
      <script src="assets/hf-adapter.js"></script>
    </div>
  </body>
</html>
